# SCMS-AI untuk Coolify: aplikasi + PostgreSQL
#
# Bedanya dengan docker-compose.yml (lokal):
# - Tidak ada "ports:". Akses publik lewat Domains di Coolify (https://domain-kamu:8000),
#   proxy Coolify yang meneruskan ke port 8000 di container app.
# - Nilai variabel diisi di menu Environment Variables Coolify, bukan dari .env.docker.
#
# Isi data demo (sekali, mengosongkan database): buka Terminal container app di Coolify, lalu
#   python -m database.seed --force

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scms_pupr_db}
      POSTGRES_USER: ${POSTGRES_USER:-scms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        WITH_AI: ${WITH_AI:-0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-scms}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-scms_pupr_db}
      SCMS_SECRET_KEY: ${SCMS_SECRET_KEY:?}
      SCMS_HTTPS_ONLY: ${SCMS_HTTPS_ONLY:-1}
      SCMS_PRODUKSI: ${SCMS_PRODUKSI:-1}
      SCMS_CV_BACKEND: ${SCMS_CV_BACKEND:-simulasi}
      SCMS_YOLO_WEIGHTS: ${SCMS_YOLO_WEIGHTS:-models/scms_v4/yolov8_infra_best.pt}
      SCMS_NLP_BACKEND: ${SCMS_NLP_BACKEND:-leksikal}
      SCMS_ST_MODEL: ${SCMS_ST_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
      HF_HOME: /app/models/hf-cache
      YOLO_CONFIG_DIR: /tmp/ultralytics
    volumes:
      - uploads:/app/app/static/uploads
      - models:/app/models

volumes:
  pgdata:
  uploads:
  models:
